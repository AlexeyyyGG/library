services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: library
      POSTGRES_USER: user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./library.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  postgres_data: